name: Desktop app

# Builds the desktop application for Windows, macOS and Linux.
# - On every push of a tag "v*" (e.g. v1.1.0): creates a GitHub release with the files attached.
# - Manually (Actions tab > Desktop app > Run workflow): files are available as build artifacts,
#   and attached to an existing release if a tag is given (e.g. v1.1.0).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the files to this existing release tag (optional, e.g. v1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel   # macos-13 runners have been retired by GitHub
            name: macos-intel
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt
      - name: Build
        run: pyinstaller packaging/pdfstudio.spec --noconfirm
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/PDF Studio.exe" -DestinationPath "PDF-Studio-${{ matrix.name }}.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "PDF Studio" -srcfolder "dist/PDF Studio.app" -ov -format UDZO "PDF-Studio-${{ matrix.name }}.dmg"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp packaging/icons/pdfstudio.png dist/
          tar -czf "PDF-Studio-${{ matrix.name }}.tar.gz" -C dist pdfstudio pdfstudio.png
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-${{ matrix.name }}
          path: PDF-Studio-*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: PDF-Studio-*
          generate_release_notes: true
